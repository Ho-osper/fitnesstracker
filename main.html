<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lean Bulk Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, big condensed numerals, bottom dock for the four views (Today, Week, Progress, Plan). */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface2:#E9EDF5; --line:#D5DBE8;
  --fg:#10141C; --muted:#566075;
  --volt:#D93E04; --volt-ink:#FFFFFF; --pulse:#007F7A;
  --good:#15803D; --warn:#B45309; --bad:#C62828;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1017; --surface:#161A24; --surface2:#212737; --line:#2C3447;
    --fg:#F1F3F8; --muted:#98A2B8;
    --volt:#FF6A2B; --volt-ink:#140D08; --pulse:#35D6CB;
    --good:#42DC86; --warn:#FFB43A; --bad:#FF6B78; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#161A24; --surface2:#212737; --line:#2C3447;
  --fg:#F1F3F8; --muted:#98A2B8;
  --volt:#FF6A2B; --volt-ink:#140D08; --pulse:#35D6CB;
  --good:#42DC86; --warn:#FFB43A; --bad:#FF6B78; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 110px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;text-wrap:balance}
h2{font-size:24px;font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:800 22px var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand svg{color:var(--volt)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.chip.hot{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.synced{background:var(--good)}.dot.saving{background:var(--warn)}.dot.error{background:var(--bad)}.dot.slow{background:var(--warn)}

/* hero */
.hero{display:flex;flex-direction:column;gap:10px}
.dayname{font:800 clamp(44px,12vw,72px)/.9 var(--display);text-transform:uppercase;letter-spacing:.01em}
.dayname span{color:var(--volt)}
.nav{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--surface2);font-weight:600;line-height:1.1}
.btn.primary{background:var(--volt);color:var(--volt-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.icon{width:40px;height:40px;padding:0;display:grid;place-items:center}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--volt);border-radius:99px}

/* rings + quick stats */
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ringcard{display:flex;align-items:center;gap:12px}
.ring{width:84px;height:84px;flex:none}
.big{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font:600 14px var(--body);color:var(--muted);margin-left:3px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.quick label,.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 0;font-weight:700}
.seg button[aria-pressed=true]{background:var(--pulse);border-color:var(--pulse);color:var(--volt-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{font:800 24px var(--display);min-width:2ch;text-align:center}

/* checklist items */
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.item:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;margin-top:1px}
.check svg{opacity:0;color:var(--volt-ink)}
[aria-checked=true]>.check{background:var(--volt);border-color:var(--volt)}
[aria-checked=true]>.check svg{opacity:1}
.itime{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{display:block;color:var(--muted);font-size:13.5px}
.nums{text-align:right;font:700 18px/1.15 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.nums small{font:500 11px var(--body);color:var(--muted);margin-left:2px}
.now{font-size:11px;font-weight:700;letter-spacing:.1em;background:var(--pulse);color:var(--volt-ink);border-radius:5px;padding:1px 6px;margin-left:6px}
.done .itime,.done strong{text-decoration:line-through;text-decoration-thickness:1px;opacity:.6}

/* lifts */
.lift{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lift:last-of-type{border-bottom:0}
.lift .hint{grid-column:1/-1;font-size:12.5px;color:var(--pulse);font-weight:600}
.lift input{text-align:center;padding:8px 4px}

/* week */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:4px}
.daycard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:center}
.daycard.sel{border-color:var(--volt)}
.daycard .dn{font:800 28px/1 var(--display);text-transform:uppercase}
.daycard .dn small{display:block;font:600 12px var(--body);color:var(--muted)}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* charts + heatmap */
.chart{width:100%;max-width:560px;height:auto;display:block}
.ax{fill:var(--muted);font:11px var(--body)}
.gl{stroke:var(--line);stroke-width:1}
.ref{stroke:var(--pulse);stroke-width:1.5;stroke-dasharray:5 4}
.heat{display:grid;grid-template-columns:auto repeat(12,minmax(0,1fr));gap:4px;align-items:center}
.heat .hl{font-size:11px;color:var(--muted)}
.heat button{aspect-ratio:1;border-radius:5px;border:1px solid var(--line);padding:0;background:var(--surface2)}
.heat button.fut{background:transparent;border-style:dashed}
.advice{border-left:4px solid var(--volt);padding-left:12px}
.advice.good{border-color:var(--good)}

/* plan editors */
.edrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:end}
.edrow:last-of-type{border-bottom:0}
.edrow .wide{grid-column:1/-1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 12px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.blk{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0}
textarea.mono{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:120px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 65%,transparent)}
.dockin{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px}
.dockin button{border:0;background:transparent;border-radius:999px;padding:10px 0;font:700 16px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dockin button[aria-current=page]{background:var(--volt);color:var(--volt-ink)}
@media (max-width:420px){.rings{grid-template-columns:1fr}.blk{grid-template-columns:92px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:no-preference){.bar>i,.ring circle{transition:all .4s ease}}
</style>

<div class="wrap" id="app"></div>
<nav class="dock" aria-label="Views"><div class="dockin">
  <button data-action="tab" data-tab="today">Today</button>
  <button data-action="tab" data-tab="week">Week</button>
  <button data-action="tab" data-tab="progress">Progress</button>
  <button data-action="tab" data-tab="plan">Plan</button>
</div></nav>

<script>
(function(){
"use strict";
var WD=['sun','mon','tue','wed','thu','fri','sat'];
var WDN={mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};
var ORDER=['mon','tue','wed','thu','fri','sat','sun'];
var CHK='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
var BOLT='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>';

/* ---------- helpers ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var keyOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var fromKey=function(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
var addDays=function(k,n){var d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
var today=function(){return keyOf(new Date())};
var wdOf=function(k){return WD[fromKey(k).getDay()]};
var mondayOf=function(k){var d=fromKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)};
var dayNum=function(k){var p=k.split('-').map(Number);return Math.floor(Date.UTC(p[0],p[1]-1,p[2])/864e5)};
var fmtShort=function(k){return fromKey(k).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
var fmtNum=function(t){return new Date(t*864e5).toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'UTC'})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){var n=parseFloat(v);return isFinite(n)?n:null};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var uid=function(){return Math.random().toString(36).slice(2,8)};
var r1=function(n){return Math.round(n*10)/10};
var mins=function(t){var m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t||'');if(!m)return 9999;return (Number(m[1])%12+(m[3].toUpperCase()==='PM'?12:0))*60+Number(m[2])};

/* ---------- default plan (from the personalised plan) ---------- */
var DEF=(function(){
  var n=0,e=0;
  var B=function(t,l){return{id:'b'+(++n),t:t,l:l}};
  var E=function(name,sets,reps){return{id:'e'+(++e),name:name,sets:sets,reps:reps}};
  var wkday=function(g){return[B('5:40 AM','Wake up and freshen up'),B('5:45 AM','Banana and water'),B('6:00 AM',g),B('7:05 AM','Shower and get ready'),B('7:30 AM','Breakfast'),B('8:30 AM','College, with packed lunch and snacks'),B('7:40 PM','Dinner'),B('8:30 PM','Study, DSA or assignments'),B('9:20 PM','Relax and prepare for tomorrow'),B('10:00 PM','Sleep')]};
  var wkend=function(extra){return[B('7:30 AM','Wake up and breakfast')].concat(extra,[B('9:00 AM','Core subject revision'),B('10:30 AM','DSA and coding'),B('12:00 PM','Lunch and rest'),B('4:00 PM','Assignments and practicals'),B('5:15 PM','Plan the upcoming week'),B('7:40 PM','Dinner'),B('10:00 PM','Sleep')])};
  var schedule={
    mon:wkday('Gym: Upper A'),tue:wkday('Gym: Lower A'),wed:wkday('Recovery walk and mobility'),
    thu:wkday('Gym: Upper B'),fri:wkday('Gym: Lower B'),
    sat:wkend([B('8:30 AM','Light walk and mobility')]),
    sun:wkend([B('6:30 PM','Meal prep, organise college and gym essentials')])
  };
  ORDER.forEach(function(d){schedule[d].sort(function(a,b){return mins(a.t)-mins(b.t)})});
  return{
    targets:{kcal:2600,protein:95,sleepMin:7.5,sleepMax:8.5,water:8,startWeight:50,milestone:55,goal:65,startDate:'2026-11-20'},
    meals:[
      {id:'m1',time:'5:45 AM',name:'Pre-workout',items:'1 banana, 2 dates, water',kcal:120,protein:2},
      {id:'m2',time:'7:30 AM',name:'Breakfast',items:'2 eggs, 2 whole-wheat bread slices, 250 ml milk, 1 fruit',kcal:500,protein:22},
      {id:'m3',time:'10:30 AM',name:'College snack',items:'30 g roasted chana, 15 g peanuts, 1 fruit',kcal:240,protein:10},
      {id:'m4',time:'1:00 PM',name:'Lunch',items:'2-3 rotis or rice, dal, sabzi, 150 g curd, 30 g dry soya chunks',kcal:725,protein:26},
      {id:'m5',time:'5:30 PM',name:'Weight-gain shake',items:'250 ml milk, 1 banana, 30 g oats, 1 tbsp peanut butter',kcal:425,protein:16},
      {id:'m6',time:'7:40 PM',name:'Dinner',items:'2-3 rotis or rice, 80-100 g chicken or fish (or 100-120 g paneer or tofu), vegetables',kcal:575,protein:28}
    ],
    week:{mon:'upperA',tue:'lowerA',wed:'recovery',thu:'upperB',fri:'lowerB',sat:'walk',sun:'off'},
    sessions:{
      upperA:{id:'upperA',name:'Upper A',focus:'Chest and back',type:'lift',note:'',ex:[E('Bench press',3,'6–8'),E('Lat pulldown / pull-ups',3,'8–10'),E('Incline dumbbell press',3,'8–12'),E('Chest-supported row',3,'8–12'),E('Lateral raises',3,'12–20'),E('Triceps pushdown',2,'10–15'),E('Dumbbell curls',2,'10–15')]},
      lowerA:{id:'lowerA',name:'Lower A',focus:'Quads',type:'lift',note:'',ex:[E('Barbell squat',3,'6–8'),E('Romanian deadlift',3,'8–10'),E('Leg press',2,'10–12'),E('Leg curl',2,'10–15'),E('Standing calf raises',3,'12–15'),E('Cable crunch',2,'12–15')]},
      upperB:{id:'upperB',name:'Upper B',focus:'Shoulders and back',type:'lift',note:'',ex:[E('Overhead shoulder press',3,'6–10'),E('Pull-ups / lat pulldown',3,'8–12'),E('Machine chest press',3,'8–12'),E('Seated cable row',3,'8–12'),E('Rear delt fly',2,'12–20'),E('Lateral raises',2,'12–20'),E('Hammer curls',2,'10–15'),E('Overhead triceps extension',2,'10–15')]},
      lowerB:{id:'lowerB',name:'Lower B',focus:'Glutes and hamstrings',type:'lift',note:'',ex:[E('Hack squat',3,'8–10'),E('Hip thrust',3,'8–12'),E('Bulgarian split squat',2,'8–10'),E('Seated leg curl',3,'10–15'),E('Calf raises',3,'12–15'),E('Hanging knee raises',2,'10–15')]},
      recovery:{id:'recovery',name:'Active recovery',focus:'No heavy lifting',type:'active',note:'15-20 minutes of relaxed walking, shoulder mobility, hip mobility, light stretching.',ex:[]},
      walk:{id:'walk',name:'Walking and mobility',focus:'Light activity',type:'active',note:'Light activity and stretching. No second heavy day.',ex:[]},
      off:{id:'off',name:'Rest day',focus:'Complete rest',type:'rest',note:'Sleep, eat well, prep meals for the week.',ex:[]}
    },
    schedule:schedule
  };
})();

function blankDay(){return{meals:{},extra:[],done:{},lifts:{},water:0,weight:'',sleep:'',energy:0,note:''}}
function mergeCfg(c){
  var out=clone(DEF);
  if(!c)return out;
  ['meals','week','sessions','schedule'].forEach(function(k){if(c[k])out[k]=c[k]});
  out.targets=Object.assign({},DEF.targets,c.targets||{});
  return out;
}

/* ---------- state ---------- */
var app=document.getElementById('app');
var S={config:clone(DEF),days:{},view:{tab:'today',date:today(),weekStart:mondayOf(today()),planDay:wdOf(today()),progEx:'',confirm:'',backup:''},dirtyCfg:false,dirtyDays:new Set(),sync:'local'};
var hadCache=false;
try{
  var raw=localStorage.getItem('lbt-cache');
  if(raw){var c=JSON.parse(raw);S.config=mergeCfg(c.config);S.days={};Object.keys(c.days||{}).forEach(function(k){S.days[k]=Object.assign(blankDay(),c.days[k])});hadCache=true}
}catch(e){}
function ensureDay(k){return S.days[k]||(S.days[k]=blankDay())}
function dayPlan(k){var cfg=S.config;return cfg.sessions[cfg.week[wdOf(k)]]||{type:'rest',ex:[],name:'Rest day',focus:''}}

function score(k){
  var d=S.days[k];if(!d)return 0;
  var cfg=S.config,tot=0,done=0;
  cfg.meals.forEach(function(m){tot++;if(d.meals[m.id])done++});
  if(dayPlan(k).type!=='rest'){tot++;if(d.done&&d.done.session)done++}
  tot++;if(num(d.sleep)>0)done++;
  tot++;if((d.water||0)>=cfg.targets.water)done++;
  return tot?done/tot:0;
}
function nut(k){
  var d=S.days[k],kcal=0,p=0;
  if(d){
    S.config.meals.forEach(function(m){if(d.meals[m.id]){kcal+=+m.kcal||0;p+=+m.protein||0}});
    (d.extra||[]).forEach(function(x){kcal+=+x.kcal||0;p+=+x.protein||0});
  }
  return{kcal:kcal,p:p};
}
function streak(){
  var k=today(),n=0;
  if(score(k)<0.7)k=addDays(k,-1);
  while(n<400&&score(k)>=0.7){n++;k=addDays(k,-1)}
  return n;
}
function lastLift(name,before){
  var found=null;
  Object.keys(S.days).filter(function(x){return x<before}).sort().reverse().some(function(dk){
    var L=S.days[dk].lifts||{};
    for(var id in L){var l=L[id];if(l&&l.name===name&&l.kg>0){found=Object.assign({date:dk},l);return true}}
    return false;
  });
  return found;
}
function weights(){
  var out=[];
  Object.keys(S.days).sort().forEach(function(k){var w=num(S.days[k].weight);if(w>0)out.push({k:k,t:dayNum(k),v:w})});
  return out;
}
function avgWindow(ws,endK,len){
  var e=dayNum(endK),s=e-len+1,vals=ws.filter(function(w){return w.t>=s&&w.t<=e});
  if(!vals.length)return{avg:null,n:0};
  return{avg:vals.reduce(function(a,w){return a+w.v},0)/vals.length,n:vals.length};
}

/* ---------- persistence ---------- */
var db=null,profileRef=null,daysRef=null,saveTimer=null,flushing=false,pendingRender=false;
function setSync(s){
  S.sync=s;
  var el=document.getElementById('sync');
  if(el)el.innerHTML=syncHtml();
}
function syncHtml(){
  var t={synced:'Synced',saving:'Saving',local:'This device only',error:'Sync failed, will retry',slow:'Cloud not reached yet'}[S.sync]||'';
  return '<span class="dot '+S.sync+'"></span>'+t;
}
function cache(){try{localStorage.setItem('lbt-cache',JSON.stringify({config:S.config,days:S.days}))}catch(e){}}
function markCfg(){S.dirtyCfg=true;queueSave()}
function markDay(k){S.dirtyDays.add(k);queueSave()}
function queueSave(){
  cache();
  if(db)setSync('saving');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!db){setSync('local');return}
  if(flushing){saveTimer=setTimeout(flush,300);return}
  flushing=true;
  var curDay=null,curCfg=false;
  try{
    if(S.dirtyCfg){curCfg=true;S.dirtyCfg=false;await profileRef.set(clone(S.config));curCfg=false}
    var keys=Array.from(S.dirtyDays);
    for(var i=0;i<keys.length;i++){curDay=keys[i];S.dirtyDays.delete(curDay);await daysRef.doc(curDay).set(clone(S.days[curDay]));curDay=null}
    setSync('synced');
  }catch(err){
    if(curCfg)S.dirtyCfg=true;
    if(curDay)S.dirtyDays.add(curDay);
    if(err&&err.code==='invalid_argument'){db=null;setSync('local')}
    else{setSync('error');clearTimeout(saveTimer);saveTimer=setTimeout(flush,6000)}
  }finally{flushing=false}
}
function isEditing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
function afterRemote(){if(isEditing())pendingRender=true;else render()}
document.addEventListener('focusout',function(){
  setTimeout(function(){if(pendingRender&&!isEditing()){pendingRender=false;render()}},60);
});

async function initCloud(){
  var claude=window.claude;
  if(!claude||!claude.use)return;
  var timer=setTimeout(function(){if(S.sync!=='synced')setSync(db?'slow':S.sync)},10000);
  try{
    var user=await claude.use('user');
    var id=user?await user.id():null;
    var d=id?await claude.use('db'):null;
    if(!d||!id){clearTimeout(timer);return}
    db=d;
    profileRef=db.doc('data/users/'+id+'/profile');
    daysRef=profileRef.collection('days');
    setSync('saving');
    var gotProfile=false;
    profileRef.onSnapshot(function(snap){
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists){if(!S.dirtyCfg)S.config=mergeCfg(snap.data())}
      else if(hadCache){S.dirtyCfg=true}
      gotProfile=true;
      if(!snap.metadata.fromCache){clearTimeout(timer);if(!S.dirtyCfg&&S.dirtyDays.size===0)setSync('synced');else queueSave()}
      cache();afterRemote();
    },function(){setSync('error')});
    var first=true;
    daysRef.onSnapshot(function(snap){
      if(snap.metadata.hasPendingWrites)return;
      var remote={};
      snap.docs.forEach(function(doc){remote[doc.id]=1;if(!S.dirtyDays.has(doc.id))S.days[doc.id]=Object.assign(blankDay(),clone(doc.data()))});
      if(first&&!snap.metadata.fromCache){
        first=false;
        Object.keys(S.days).forEach(function(k){if(!remote[k]&&(nut(k).kcal>0||S.days[k].weight!==''))S.dirtyDays.add(k)});
        if(S.dirtyDays.size)queueSave();
      }
      cache();afterRemote();
    },function(){setSync('error')});
  }catch(e){clearTimeout(timer)}
}

/* ---------- charts ---------- */
function lineChart(o){
  var dots=o.dots||[],line=o.line||[],ref=o.ref;
  var all=dots.concat(line);
  if(!all.length)return '<p class="muted">Nothing logged yet.</p>';
  var w=420,h=240,L=40,R=12,T=14,B=28;
  var t0=Math.min.apply(null,all.map(function(p){return p.t})),t1=Math.max.apply(null,all.map(function(p){return p.t}));
  if(t1-t0<13)t0=t1-13;
  var vs=all.map(function(p){return p.v});if(ref)vs.push(ref.v);
  var lo=Math.floor(Math.min.apply(null,vs)-0.5),hi=Math.ceil(Math.max.apply(null,vs)+0.5);
  var step=(hi-lo)>12?2:1;if((hi-lo)%step)hi+=step-((hi-lo)%step);
  var X=function(t){return L+(t-t0)/(t1-t0)*(w-L-R)},Y=function(v){return T+(1-(v-lo)/(hi-lo))*(h-T-B)};
  var s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.label||'Chart')+'">';
  for(var v=lo;v<=hi;v+=step){s+='<line class="gl" x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'}
  [t0,Math.round((t0+t1)/2),t1].forEach(function(t,i){s+='<text class="ax" x="'+X(t)+'" y="'+(h-8)+'" text-anchor="'+(i===0?'start':i===2?'end':'middle')+'">'+fmtNum(t)+'</text>'});
  if(ref){s+='<line class="ref" x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(ref.v)+'" y2="'+Y(ref.v)+'"/><text class="ax" style="fill:var(--pulse)" x="'+(w-R)+'" y="'+(Y(ref.v)-5)+'" text-anchor="end">'+esc(ref.label)+'</text>'}
  if(line.length>1){s+='<polyline fill="none" stroke="var(--volt)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+line.map(function(p){return X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ')+'"/>'}
  dots.forEach(function(p){s+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="var(--fg)" fill-opacity=".55"/>'});
  var last=line.length?line[line.length-1]:dots[dots.length-1];
  s+='<circle cx="'+X(last.t).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="6" fill="var(--volt)"/>';
  return s+'</svg>';
}
function ring(pct,color,label){
  var c=2*Math.PI*38,p=Math.max(0,Math.min(pct,1));
  return '<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="'+esc(label)+'"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--surface2)" stroke-width="11"/><circle cx="50" cy="50" r="38" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 50 50)"/></svg>';
}

  var fld=function(label,path,val,type,extra){return '<label class="f">'+label+'<input type="'+(type||'text')+'" data-path="'+path+'" '+(type==='number'?'data-num="1" inputmode="decimal" step="any" ':'')+(extra||'')+' value="'+esc(val)+'"></label>'};
  h+='<section class="card stack"><h2>Targets</h2><div class="quick">'+
    fld('Daily calories','cfg.targets.kcal',T.kcal,'number')+fld('Daily protein (g)','cfg.targets.protein',T.protein,'number')+
    fld('Sleep min (h)','cfg.targets.sleepMin',T.sleepMin,'number')+fld('Sleep max (h)','cfg.targets.sleepMax',T.sleepMax,'number')+
    fld('Water (glasses)','cfg.targets.water',T.water,'number')+fld('Start weight (kg)','cfg.targets.startWeight',T.startWeight,'number')+
    fld('First milestone (kg)','cfg.targets.milestone',T.milestone,'number')+fld('Long-term goal (kg)','cfg.targets.goal',T.goal,'number')+
    fld('Plan start date','cfg.targets.startDate',T.startDate,'date')+'</div></section>';

  h+='<section class="card stack"><h2>Meals</h2><p class="muted">Calories and protein are estimates. Change them to match your mess portions.</p><div>'+
    cfg.meals.map(function(m,i){var p='cfg.meals.'+i+'.';return '<div class="edrow">'+fld('Time',p+'time',m.time)+fld('Meal',p+'name',m.name)+fld('kcal',p+'kcal',m.kcal,'number')+fld('Protein (g)',p+'protein',m.protein,'number')+'<label class="f wide">What is in it<input data-path="'+p+'items" value="'+esc(m.items)+'"></label><button class="btn sm ghost" data-action="del-meal" data-i="'+i+'">Remove meal</button></div>'}).join('')+
    '</div><div class="row"><button class="btn" data-action="add-meal">Add meal</button></div></section>';

  h+='<section class="card stack"><h2>Daily schedule</h2><div class="tabs">'+ORDER.map(function(d){return '<button data-action="plan-day" data-d="'+d+'" aria-pressed="'+(d===pd)+'">'+d+'</button>'}).join('')+'</div><div>'+
    (cfg.schedule[pd]||[]).map(function(b,i){var p='cfg.schedule.'+pd+'.'+i+'.';return '<div class="blk"><input data-path="'+p+'t" aria-label="Time" value="'+esc(b.t)+'"><input data-path="'+p+'l" aria-label="Activity" value="'+esc(b.l)+'"><button class="btn sm ghost" data-action="del-block" data-i="'+i+'" aria-label="Remove block">Remove</button></div>'}).join('')+
    '</div><div class="row"><button class="btn" data-action="add-block">Add block</button><button class="btn ghost" data-action="sort-blocks">Sort by time</button><button class="btn ghost" data-action="copy-day">Copy to every weekday</button></div></section>';

  h+='<section class="card stack"><h2>Training week</h2><div class="quick">'+ORDER.map(function(d){return '<label class="f">'+WDN[d]+'<select data-path="cfg.week.'+d+'">'+Object.keys(cfg.sessions).map(function(s){return '<option value="'+s+'"'+(cfg.week[d]===s?' selected':'')+'>'+esc(cfg.sessions[s].name)+'</option>'}).join('')+'</select></label>'}).join('')+'</div></section>';

  Object.keys(cfg.sessions).forEach(function(sid){
    var s=cfg.sessions[sid],p='cfg.sessions.'+sid+'.';
    h+='<section class="card stack"><div class="edrow" style="border:0;padding:0">'+fld('Session name',p+'name',s.name)+fld('Focus',p+'focus',s.focus)+'<label class="f">Type<select data-path="'+p+'type"><option value="lift"'+(s.type==='lift'?' selected':'')+'>Lifting</option><option value="active"'+(s.type==='active'?' selected':'')+'>Active recovery</option><option value="rest"'+(s.type==='rest'?' selected':'')+'>Rest</option></select></label></div>'+
      (s.type==='lift'?'<div>'+s.ex.map(function(e,i){var q=p+'ex.'+i+'.';return '<div class="edrow">'+'<label class="f wide">Exercise<input data-path="'+q+'name" value="'+esc(e.name)+'"></label>'+fld('Sets',q+'sets',e.sets,'number')+fld('Reps',q+'reps',e.reps)+'<button class="btn sm ghost" data-action="del-ex" data-s="'+sid+'" data-i="'+i+'">Remove</button></div>'}).join('')+'</div><div class="row"><button class="btn" data-action="add-ex" data-s="'+sid+'">Add exercise</button></div>':'<label class="f">Note<textarea data-path="'+p+'note">'+esc(s.note)+'</textarea></label>')+
      '<div class="row"><button class="btn sm ghost" data-action="del-session" data-s="'+sid+'">Delete session</button></div></section>';
  });
  h+='<section class="card"><div class="row"><button class="btn" data-action="add-session">Add session type</button></div></section>';

  h+='<section class="card stack"><h2>Backup and reset</h2><p class="muted">Your log syncs to your account when you are signed in. A backup is a text copy you can keep or paste into another browser.</p><div class="row"><button class="btn" data-action="show-backup">Show backup text</button></div>'+
    (V.backup?'<textarea id="backupbox" class="mono" aria-label="Backup text">'+esc(V.backup)+'</textarea><p class="muted" id="copymsg"></p>':'')+
    '<label class="f">Paste a backup to restore<textarea id="importbox" class="mono" placeholder="Paste backup text here"></textarea></label><div class="row"><button class="btn'+(V.confirm==='import'?' danger':'')+'" data-action="import">'+(V.confirm==='import'?'Confirm: replace everything':'Restore from backup')+'</button><button class="btn'+(V.confirm==='reset'?' danger':'')+'" data-action="reset">'+(V.confirm==='reset'?'Confirm: reset plan to default':'Reset plan to default')+'</button></div><p class="muted" id="planmsg"></p></section>';
  return h;
}

function render(){
  var v=S.view;
  document.querySelectorAll('.dock button').forEach(function(b){b.setAttribute('aria-current',b.dataset.tab===v.tab?'page':'false')});
  var fn={today:viewToday,week:viewWeek,progress:viewProgress,plan:viewPlan}[v.tab]||viewToday;
  app.innerHTML=head()+fn();
}
function refreshLive(){
  var k=S.view.date,sc=Math.round(score(k)*100);
  var a=document.getElementById('score'),b=document.getElementById('scorebar'),c=document.getElementById('streak');
  if(a)a.textContent=sc+'%';if(b)b.style.width=sc+'%';if(c)c.textContent=streak()+'-day streak';
}

/* ---------- editing ---------- */
function setPath(path,val){
  var parts=path.split('.'),root=parts.shift(),o=root==='day'?ensureDay(S.view.date):S.config;
  for(var i=0;i<parts.length-1;i++){if(o[parts[i]]==null)return;o=o[parts[i]]}
  o[parts[parts.length-1]]=val;
  if(root==='day')markDay(S.view.date);else markCfg();
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.lift){
    var d=ensureDay(S.view.date),l=d.lifts[t.dataset.lift]||(d.lifts[t.dataset.lift]={name:t.dataset.name});
    l.name=t.dataset.name;l[t.dataset.field]=t.value===''?'':Number(t.value);markDay(S.view.date);return;
  }
  if(t.dataset&&t.dataset.path){
    var val=t.dataset.num?(t.value===''?'':Number(t.value)):t.value;
    setPath(t.dataset.path,val);
    if(t.dataset.refresh)refreshLive();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='progex'){S.view.progEx=t.value;render();return}
  if(t.tagName==='SELECT'&&t.dataset.path&&S.view.tab==='plan'){/* session or week change: names in selects need a refresh */render()}
});

function msg(id,text){var el=document.getElementById(id);if(el)el.textContent=text}
function go(tab){location.hash=tab}
window.addEventListener('hashchange',function(){
  var t=location.hash.replace('#','');
  if(['today','week','progress','plan'].indexOf(t)>-1){S.view.tab=t;S.view.confirm='';render();window.scrollTo(0,0)}
});

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;
  var a=el.dataset.action,V=S.view,k=V.date,cfg=S.config,D=el.dataset;
  var day=function(){return ensureDay(k)};
  switch(a){
    case 'tab':go(D.tab);return;
    case 'day-prev':V.date=addDays(k,-1);break;
    case 'day-next':V.date=addDays(k,1);break;
    case 'day-today':V.date=today();break;
    case 'goto-day':V.date=D.k;V.tab='today';location.hash='today';window.scrollTo(0,0);break;
    case 'week-prev':V.weekStart=addDays(V.weekStart,-7);break;
    case 'week-next':V.weekStart=addDays(V.weekStart,7);break;
    case 'toggle-meal':var m=day().meals;m[D.id]=!m[D.id];markDay(k);break;
    case 'toggle-block':case 'toggle-session':var dn=day().done;var key=a==='toggle-session'?'session':D.id;dn[key]=!dn[key];markDay(k);break;
    case 'water-inc':day().water=(day().water||0)+1;markDay(k);break;
    case 'water-dec':day().water=Math.max(0,(day().water||0)-1);markDay(k);break;
    case 'energy':day().energy=day().energy===+D.v?0:+D.v;markDay(k);break;
    case 'add-extra':
      var nm=document.getElementById('xn').value.trim(),kc=num(document.getElementById('xk').value)||0,pr=num(document.getElementById('xp').value)||0;
      if(!nm)return;day().extra.push({name:nm,kcal:kc,protein:pr});markDay(k);break;
    case 'del-extra':day().extra.splice(+D.i,1);markDay(k);break;
    case 'apply-kcal':cfg.targets.kcal+=+D.n;markCfg();break;
    case 'plan-day':V.planDay=D.d;break;
    case 'add-meal':cfg.meals.push({id:'m'+uid(),time:'12:00 PM',name:'New meal',items:'',kcal:300,protein:10});markCfg();break;
    case 'del-meal':cfg.meals.splice(+D.i,1);markCfg();break;
    case 'add-block':cfg.schedule[V.planDay].push({id:'b'+uid(),t:'12:00 PM',l:'New block'});markCfg();break;
    case 'del-block':cfg.schedule[V.planDay].splice(+D.i,1);markCfg();break;
    case 'sort-blocks':cfg.schedule[V.planDay].sort(function(x,y){return mins(x.t)-mins(y.t)});markCfg();break;
    case 'copy-day':['mon','tue','wed','thu','fri'].forEach(function(d){if(d!==V.planDay)cfg.schedule[d]=cfg.schedule[V.planDay].map(function(b){return{id:'b'+uid(),t:b.t,l:b.l}})});markCfg();break;
    case 'add-ex':cfg.sessions[D.s].ex.push({id:'e'+uid(),name:'New exercise',sets:3,reps:'8–12'});markCfg();break;
    case 'del-ex':cfg.sessions[D.s].ex.splice(+D.i,1);markCfg();break;
    case 'add-session':var id='s'+uid();cfg.sessions[id]={id:id,name:'New session',focus:'',type:'lift',note:'',ex:[]};markCfg();break;
    case 'del-session':
      delete cfg.sessions[D.s];
      var fallback=Object.keys(cfg.sessions)[0];
      if(!fallback){cfg.sessions.off={id:'off',name:'Rest day',focus:'',type:'rest',note:'',ex:[]};fallback='off'}
      ORDER.forEach(function(d){if(!cfg.sessions[cfg.week[d]])cfg.week[d]=fallback});markCfg();break;
    case 'show-backup':
      V.backup=JSON.stringify({config:S.config,days:S.days});render();
      var box=document.getElementById('backupbox');
      if(box){box.focus();box.select();
        try{navigator.clipboard.writeText(V.backup).then(function(){msg('copymsg','Copied to clipboard.')},function(){msg('copymsg','Select the text above and copy it.')})}catch(x){msg('copymsg','Select the text above and copy it.')}}
      return;
    case 'import':
      if(V.confirm!=='import'){V.confirm='import';V.confirm2=1;render();return}
      var txt=(document.getElementById('importbox')||{}).value||'';
      try{
        var o=JSON.parse(txt);if(!o||typeof o.config!=='object'||typeof o.days!=='object')throw 0;
        S.config=mergeCfg(o.config);S.days={};Object.keys(o.days).forEach(function(d){S.days[d]=Object.assign(blankDay(),o.days[d])});
        S.dirtyCfg=true;Object.keys(S.days).forEach(function(d){S.dirtyDays.add(d)});queueSave();V.confirm='';render();msg('planmsg','Backup restored.');return;
      }catch(x){V.confirm='';render();msg('planmsg','That text is not a valid backup. Nothing was changed.');return}
    case 'reset':
      if(V.confirm!=='reset'){V.confirm='reset';render();return}
      S.config=clone(DEF);markCfg();V.confirm='';render();msg('planmsg','Plan reset. Your daily logs are untouched.');return;
    default:return;
  }
  V.confirm='';
  render();
});

/* ---------- boot ---------- */
(function(){var t=location.hash.replace('#','');if(['today','week','progress','plan'].indexOf(t)>-1)S.view.tab=t})();
render();
initCloud();
})();
</script>

</body></html>
